<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="./main.js" defer></script>
    <title>Calculador de Comissão</title>
</head>
<body>
    <main>
        <form class="container">
            <h1 class="titulo">Calculadora de Comissão</h1>
            <input id="caixa-nome" class="caixa-texto" type="text" placeholder="Digite seu nome">
            <input id="caixa-valor" class="caixa-texto" type="number" placeholder="Digite o valor de vendas">
            <button id="botao-calcular" class="botao-calcular" type="button">Calcular Salário</button>
            <div id="resultado" class="resultado">O resultado aparecerá aqui...</div>
        </form>
    </main>    
</body>
</html>
